<main class="overviews-page">
  <header class="overviews-page__header">
    <div>
      <p class="overviews-page__eyebrow">WORKSPACE / DELIVERY</p>
    </div>
  </header>

  <section class="project-panel project-form" aria-labelledby="project-form-title">
    <div class="project-panel__heading">
      <div>
        <p class="projects-page__eyebrow">Search Option</p>
      </div>
    </div>
    <hr />
    <form class="container-fluid">
      <!-- BARIS 1: Date -->
      <div class="row mb-3">
        <!-- Kolom Kanan: Date -->
        <div class="col-12 col-lg-6">
          <div class="row align-items-center">
            <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="job-date">
              Document Date
            </label>
            <div class="col-8">
              <div class="dp-hidden position-absolute">
                <div class="input-group">
                  <input
                    name="datepicker"
                    class="form-control"
                    ngbDatepicker
                    #datepicker="ngbDatepicker"
                    [autoClose]="'outside'"
                    (dateSelect)="onDateSelection($event)"
                    [displayMonths]="2"
                    [dayTemplate]="t"
                    outsideDays="hidden"
                    [startDate]="fromDate!"
                    tabindex="-1"
                  />
                  <ng-template #t let-date let-focused="focused">
                    <span
                      class="custom-day"
                      [class.focused]="focused"
                      [class.range]="isRange(date)"
                      [class.faded]="isHovered(date) || isInside(date)"
                      (mouseenter)="hoveredDate = date"
                      (mouseleave)="hoveredDate = null"
                    >
                      {{ date.day }}
                    </span>
                  </ng-template>
                </div>
              </div>
              <div class="input-group">
                <input
                  (click)="datepicker.toggle()"
                  #dpFromDate
                  class="form-control"
                  placeholder="dd-mm-yyyy"
                  name="dpFromDate"
                  [value]="fromDate | customDateFormatter: toDate"
                  (input)="fromDate = validateInput(fromDate, dpFromDate.value)"
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  (click)="datepicker.toggle()"
                >
                  <i class="fa-regular fa-calendar-days"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- BARIS 2: Job Order No -->
      <div class="row mb-3">
        <!-- Kolom Kiri: Job Order No. -->
        <div class="col-12 col-lg-6">
          <div class="row align-items-center">
            <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="jobOrderNo">
              Job Order No.
            </label>
            <div class="col-sm-8">
              <input
                class="form-control"
                id="jobOrderNo"
                type="text"
                placeholder="Masukkan nomor job order"
              />
            </div>
          </div>
        </div>
      </div>
      <!-- BARIS 3: Document No -->
      <div class="row mb-3">
        <!-- Kolom Kiri: Document No. -->
        <div class="col-12 col-lg-6">
          <div class="row align-items-center">
            <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="documentNo">
              Document No.
            </label>
            <div class="col-sm-8">
              <input
                class="form-control"
                id="documentNo"
                type="text"
                placeholder="Masukkan nomor document"
              />
            </div>
          </div>
        </div>
      </div>
      <!-- BARIS 4: Driver -->
      <div class="row mb-3">
        <!-- Kolom Kiri: Driver No. -->
        <div class="col-12 col-lg-6">
          <div class="row align-items-center">
            <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="driverName">
              Driver
            </label>
            <div class="col-sm-8">
              <select class="form-select" id="driverName">
                <option value="">Select Driver</option>
                <option value="1">PT FASTANA LOGISTIK INDONESIA</option>
                <option value="2">PT. CARGILL INDONESIA</option>
                <option value="3">PT. NESTLE INDONESIA</option>
              </select>
            </div>
          </div>
        </div>
        <!-- Kolom Kanan: Project -->
        <div class="col-12 col-lg-6">
          <div class="row align-items-center">
            <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="projectName">
              Project
            </label>
            <div class="col-sm-8">
              <select class="form-select" id="projectName">
                <option value="">Select option</option>
                <option value="1">ADN</option>
                <option value="2">JTN</option>
                <option value="3">SHI</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <!-- BARIS 5: Advance Search -->
      <div class="row mb-6">
        <!-- Kolom Kiri: Advance Search -->
        <div class="col-12 col-lg-6">
          <div class="row align-items-center">
            <label class="col-sm-4 col-form-label text-sm-end fw-bold" style="line-height: 1.2">
              Advance Search
            </label>
            <div class="col-sm-8">
              <div class="row g-2">
                <div class="col-5">
                  <select class="form-select" id="advanceSearch">
                    <option value="">Select Option</option>
                    <option value="1">Job Order No.</option>
                    <option value="2">Driver Name</option>
                    <option value="3">Account No.</option>
                  </select>
                </div>
                <div class="col-7">
                  <input class="form-control" type="text" value="" />
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showMoreThanHundred" />
                  <label class="form-check-label" for="showMoreThanHundred"
                    >Show more than 100</label
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Search -->
      <div class="container-sm mt-2">
        <button class="btn btn-primary btn-sm m-1">Search</button>
      </div>
    </form>
  </section>

  <!-- Table -->
  <section class="project-panel my-3">
    <div class="row my-2">
      <span>Result</span>
      <hr />
    </div>
    <div class="table-responsive">
      <table class="table">
        <thead class="table-overview">
          <tr>
            <th scope="col">Costing No.</th>
            <th scope="col">Costing Date</th>
            <th scope="col">Job Order</th>
            <th scope="col">Project</th>
            <th scope="col">Route Name</th>
            <th scope="col">Driver Name</th>
            <th scope="col">Bank Account</th>
            <th scope="col">Amount</th>
            <th scope="col">Deduction</th>
            <th scope="col">Transfer Amount</th>
            <th scope="col">Status</th>
            <th scope="col">Message</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>* Click search to view data</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
