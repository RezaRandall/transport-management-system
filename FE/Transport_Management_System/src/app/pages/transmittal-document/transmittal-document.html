<main class="overviews-page">
  <header class="overviews-page__header">
    <div>
      <h1>Transmittial Documents</h1>
    </div>
  </header>

  <ul ngbNav #nav="ngbNav" [(activeId)]="active" [destroyOnHide]="false" class="nav-tabs">
    <li [ngbNavItem]="1">
      <button ngbNavLink>Operation</button>
      <ng-template ngbNavContent> </ng-template>
    </li>
    <li [ngbNavItem]="2">
      <button ngbNavLink>POD</button>
      <ng-template ngbNavContent> </ng-template>
    </li>
    <li [ngbNavItem]="3">
      <button ngbNavLink>Billing</button>
      <ng-template ngbNavContent let-active> </ng-template>
    </li>
    <li [ngbNavItem]="4">
      <button ngbNavLink>Customer</button>
      <ng-template ngbNavContent let-active> </ng-template>
    </li>
    <li [ngbNavItem]="5">
      <button ngbNavLink>Clerk</button>
      <ng-template ngbNavContent let-active> </ng-template>
    </li>
    <li [ngbNavItem]="6">
      <button ngbNavLink>Report</button>
      <ng-template ngbNavContent let-active> </ng-template>
    </li>
  </ul>

  <section class="project-panel" aria-labelledby="project-form-title">
    <div class="project-panel__heading">
      <div>
        <p class="projects-page__eyebrow">Search Option</p>
      </div>
    </div>
    <app-form-transmittial-document>
      @if (active() === 1 || active() === 2) {
        <app-button-print btnPrint></app-button-print>
      }
    </app-form-transmittial-document>
  </section>

  <section class="project-panel my-3">
    <div class="row my-2">
      <span>Result</span>
    </div>
    <hr />
    <div class="table-responsive">
      <table class="table">
        <thead class="table-overview">
          <tr>
            <th scope="col">Action</th>
            <th scope="col">Job Number</th>
            <th scope="col">Job Date</th>
            <th scope="col">Customer</th>
            <th scope="col">Service Class</th>
            <th scope="col">Project</th>
            <th scope="col">Vehicle</th>
            <th scope="col">Reference No</th>
            <th scope="col">Route</th>
            <th scope="col">ETD</th>
            <th scope="col">Doc. Name</th>
            <th scope="col">Doc. No.</th>
            <th scope="col">Sent to POD</th>
            <th scope="col">Sent By</th>
            <th scope="col">POD Received</th>
            <th scope="col">POD Received By</th>
            <th scope="col">Remark</th>
            <th scope="col">Aging</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>No data</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
