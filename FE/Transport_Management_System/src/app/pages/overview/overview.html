<main class="overviews-page">
  <header class="overviews-page__header">
    <div>
      <p class="overviews-page__eyebrow">WORKSPACE / DELIVERY</p>
      <h1>Booking</h1>
      <p class="overviews-page__intro">
        Keep client work, project leads, and key contacts in one place.
      </p>
    </div>
  </header>

  <section class="project-panel project-form" aria-labelledby="project-form-title">
    <div class="project-panel__heading">
      <div>
        <p class="projects-page__eyebrow">Search Option</p>
      </div>
    </div>

    <form class="container-fluid">
      <!-- Baris 1: Booking Date & Tombol New Booking -->
      <div class="row mb-1 align-items-center">
        <!-- Kolom Kiri: Booking Date -->
        <div class="col-md-6">
          <div class="row align-items-center">
            <label class="col-sm-3 col-form-label text-sm-end fw-bold small" for="booking-date"
              >Booking Date</label
            >
            <div class="col-8">
              <div class="dp-hidden position-absolute">
                <div class="input-group">
                  <input
                    name="datepicker"
                    class="form-control input-xs"
                    ngbDatepicker
                    #datepicker="ngbDatepicker"
                    [autoClose]="'outside'"
                    (dateSelect)="onDateSelection($event)"
                    [displayMonths]="2"
                    [dayTemplate]="t"
                    outsideDays="hidden"
                    [startDate]="fromDate!"
                    tabindex="-1"
                  />
                  <ng-template #t let-date let-focused="focused">
                    <span
                      class="custom-day input-xs"
                      [class.focused]="focused"
                      [class.range]="isRange(date)"
                      [class.faded]="isHovered(date) || isInside(date)"
                      (mouseenter)="hoveredDate = date"
                      (mouseleave)="hoveredDate = null"
                    >
                      {{ date.day }}
                    </span>
                  </ng-template>
                </div>
              </div>
              <div class="input-group">
                <input
                  (click)="datepicker.toggle()"
                  #dpFromDate
                  class="form-control input-xs"
                  placeholder="dd-mm-yyyy"
                  name="dpFromDate"
                  [value]="fromDate | customDateFormatter: toDate"
                  (input)="fromDate = validateInput(fromDate, dpFromDate.value)"
                />
                <button
                  class="btn btn-outline-secondary input-xs"
                  type="button"
                  (click)="datepicker.toggle()"
                >
                  <i class="fa-regular fa-calendar-days"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- Kolom Kanan:Tombol New Booking-->
        <div class="col-md-6 d-flex justify-content-md-end mt-2 mt-md-0">
          <button
            class="btn btn-warning text-dark px-3 py-1 fw-medium"
            id="new-booking"
            name="newBooking"
            type="button"
            routerLink="/admin/create"
          >
            New Booking
          </button>
        </div>
      </div>
      <!-- Baris 2: Customer & Project -->
      <div class="row mb-1 align-items-center">
        <!-- Kolom Kiri: Customer -->
        <div class="col-md-6">
          <div class="row align-items-center">
            <label class="col-sm-3 col-form-label text-sm-end fw-bold small" for="customerName"
              >Customer</label
            >
            <div class="col-sm-7">
              <select class="form-select form-select-sm text-muted" id="customerName">
                <option value="">Select an option</option>
                <option value="1">SHELL INDONESIA</option>
                <option value="2">PT. CARGILL INDONESIA</option>
                <option value="3">PT. NESTLE INDONESIA</option>
              </select>
            </div>
          </div>
        </div>
        <!-- Kolom Kanan: Project-->
        <div class="col-md-6 mt-2 mt-md-0">
          <div class="row align-items-center">
            <label class="col-sm-3 col-form-label text-sm-end fw-bold small" for="projectName"
              >Project</label
            >
            <div class="col-sm-6">
              <select class="form-select form-select-sm text-muted" id="projectName">
                <option value="">Select an option</option>
                <option value="1">SHELL INDONESIA</option>
                <option value="2">PT. CARGILL INDONESIA</option>
                <option value="3">PT. NESTLE INDONESIA</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <!-- Baris 3: Booking No. & Job Order No. -->
      <div class="row mb-1 align-items-center">
        <!-- Kolom Kiri: Booking No. -->
        <div class="col-md-6">
          <div class="row align-items-center">
            <label class="col-sm-3 col-form-label text-sm-end fw-bold small" for="booking-no"
              >Booking No.</label
            >
            <div class="input-group-sm col-sm-6">
              <input
                formControlName="bookingNo"
                class="form-control input-xs"
                id="booking-no"
                name="bookingNo"
                type="text"
              />
            </div>
          </div>
        </div>
        <!-- Kolom Kanan: Job Order No.-->
        <div class="col-md-6 mt-2 mt-md-0">
          <div class="row align-items-center">
            <label class="col-sm-3 col-form-label text-sm-end fw-bold small" for="job-order"
              >Job Order No.</label
            >
            <div class="col-sm-6">
              <input
                formControlName="jobOrder"
                class="form-control input-xs"
                id="job-order"
                name="jobOrder"
                type="text"
              />
            </div>
          </div>
        </div>
      </div>
      <!-- Baris 4: Vehicle No. & Driver -->
      <div class="row mb-1 align-items-center">
        <!-- Kolom Kiri: Vehicle No. -->
        <div class="col-md-6">
          <div class="row align-items-center">
            <label class="col-sm-3 col-form-label text-sm-end fw-bold small" for="vehicleNo"
              >Vehicle No.</label
            >
            <div class="col-sm-5">
              <select class="form-select form-select-sm text-muted" id="vehicleNo">
                <option value="">Select an option</option>
                <option value="1">SHELL INDONESIA</option>
                <option value="2">PT. CARGILL INDONESIA</option>
                <option value="3">PT. NESTLE INDONESIA</option>
              </select>
            </div>
          </div>
        </div>
        <!-- Kolom Kanan: Driver-->
        <div class="col-md-6 mt-2 mt-md-0">
          <div class="row align-items-center">
            <label class="col-sm-3 col-form-label text-sm-end fw-bold small" for="driverName"
              >Driver</label
            >
            <div class="col-sm-7">
              <select class="form-select form-select-sm text-muted" id="driverName">
                <option value="">Select an option</option>
                <option value="1">SHELL INDONESIA</option>
                <option value="2">PT. CARGILL INDONESIA</option>
                <option value="3">PT. NESTLE INDONESIA</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <!-- Baris 5: Route & Service Class -->
      <div class="row mb-1 align-items-center">
        <!-- Kolom Kiri: Route -->
        <div class="col-md-6">
          <div class="row align-items-center">
            <label class="col-sm-3 col-form-label text-sm-end fw-bold small" for="routeNameId"
              >Route</label
            >
            <div class="col-sm-7">
              <select class="form-select form-select-sm text-muted" id="routeNameId">
                <option value="">Select an option</option>
                <option value="1">SHELL INDONESIA</option>
                <option value="2">PT. CARGILL INDONESIA</option>
                <option value="3">PT. NESTLE INDONESIA</option>
              </select>
            </div>
          </div>
        </div>
        <!-- Kolom Kanan: Service Class-->
        <div class="col-md-6 mt-2 mt-md-0">
          <div class="row align-items-center">
            <label class="col-sm-3 col-form-label text-sm-end fw-bold small" for="clientName"
              >Service Class</label
            >
            <div class="col-sm-6">
              <select class="form-select form-select-sm text-muted" id="clientName">
                <option value="">Select an option</option>
                <option value="1">SHELL INDONESIA</option>
                <option value="2">PT. CARGILL INDONESIA</option>
                <option value="3">PT. NESTLE INDONESIA</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <!-- Kolom 6: Advance Search & Status -->
      <div class="row mb-1 align-items-center">
        <!-- Kolom Kiri: Advance Search -->
        <div class="col-md-6">
          <div class="row align-items-center">
            <label
              class="col-sm-3 col-form-label text-sm-end fw-bold small"
              style="line-height: 1.2"
            >
              Advance Search
            </label>
            <div class="col-sm-7">
              <div class="row g-2">
                <div class="col-sm-7">
                  <select class="form-select form-select-sm" id="customerName">
                    <option value="">Select option</option>
                    <option value="1">PT FASTANA LOGISTIK INDONESIA</option>
                    <option value="2">PT. CARGILL INDONESIA</option>
                    <option value="3">PT. NESTLE INDONESIA</option>
                  </select>
                </div>
                <div class="col-5">
                  <input class="form-control input-xs" type="text" value="" />
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- Kolom Kanan: Status -->
        <div class="col-md-6 mt-2 mt-md-0">
          <div class="row align-items-center">
            <label class="col-sm-3 col-form-label text-sm-end fw-bold small" for="status"
              >status</label
            >
            <div class="col-sm-6">
              <select class="form-select form-select-sm text-muted" id="status">
                <option value="">Select an option</option>
                <option value="1">SHELL INDONESIA</option>
                <option value="2">PT. CARGILL INDONESIA</option>
                <option value="3">PT. NESTLE INDONESIA</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <!-- Row 5: Checkbox -->
      <div class="row mb-3 align-items-center">
        <div class="col-sm-4 offset-sm-1">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="showMoreResults" />
            <label
              class="form-check-label text-secondary"
              for="showMoreResults"
              style="font-size: 0.8rem"
            >
              Show more than 100 results
            </label>
          </div>
        </div>
      </div>
      <!-- Bagian Footer Form (Tombol Search) -->
      <div class="border-t pt-3 mt-3 text-start">
        <button type="submit" class="btn btn-primary btn-sm px-4 rounded-1">Search</button>
      </div>
    </form>
  </section>

  <section class="project-panel my-3">
    <div class="row my-2">
      <span>Result</span>
    </div>
    <table class="table">
      <thead class="table-overview">
        <tr>
          <th scope="col">Booking Code</th>
          <th scope="col">Booking Date</th>
          <th scope="col">Customer</th>
          <th scope="col">Reference</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>* Click search to view data</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </tbody>
    </table>
  </section>
</main>
