<section class="project-panel" aria-labelledby="project-form-title">
  <div class="project-panel__heading">
    <div>
      <p class="projects-page__eyebrow">Results</p>
    </div>
  </div>
  <ul ngbNav #nav="ngbNav" [(activeId)]="active" [destroyOnHide]="false" class="nav-tabs">
    <li [ngbNavItem]="1">
      <button ngbNavLink>Created</button>
      <ng-template ngbNavContent> </ng-template>
    </li>
    <li [ngbNavItem]="2">
      <button ngbNavLink>Autorized</button>
      <ng-template ngbNavContent> </ng-template>
    </li>
    <li [ngbNavItem]="3">
      <button ngbNavLink>Finalized</button>
      <ng-template ngbNavContent let-active> </ng-template>
    </li>
    <li [ngbNavItem]="4">
      <button ngbNavLink>Rejected</button>
      <ng-template ngbNavContent let-active> </ng-template>
    </li>
    <li [ngbNavItem]="5">
      <button ngbNavLink>Cancelled</button>
      <ng-template ngbNavContent let-active> </ng-template>
    </li>
  </ul>
  <div class="table-responsive">
    <table class="table">
      <thead class="table-overview">
        <tr>
          <th scope="col">Date</th>
          <th scope="col">Reference</th>
          <th scope="col">Job Number</th>
          <th scope="col">Driver Name</th>
          <th scope="col">Charge Code</th>
          <th scope="col">Charge Name</th>
          <th scope="col">Based On</th>
          <th scope="col">Qty</th>
          <th scope="col">Currency</th>
          <th scope="col">Rate</th>
          <th scope="col">Debit</th>
          <th scope="col">Credit</th>
          <th scope="col">Created By</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>No data</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
