<section class="project-panel project-form" aria-labelledby="project-form-title">
  <div class="project-panel__heading">
    <div>
      <p class="projects-page__eyebrow">Search Driver</p>
    </div>
  </div>

  <form class="container-fluid">
    <!-- BARIS 1: Driver Name & new driver  -->
    <div class="row mb-3">
      <!-- Kolom Kiri: Driver Name -->
      <div class="col-12 col-lg-6">
        <div class="row align-items-center">
          <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="driverName">
            Driver Name
          </label>
          <div class="col-sm-8">
            <input
              type="text"
              formControlName="driverName"
              class="form-control"
              id="driverName"
              value=""
            />
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-xl-6 d-flex justify-content-end">
        <input
          formControlName="newDriver"
          class="btn btn-warning"
          id="new-booking"
          name="newBooking"
          type="button"
          value="New Driver"
          routerLink="/admin/driver"
        />
      </div>
    </div>
    <!-- BARIS 2: Contact Phone & KK no  -->
    <div class="row mb-3">
      <!-- Kolom Kiri: Contact Phone -->
      <div class="col-12 col-lg-6">
        <div class="row align-items-center">
          <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="contactPhone">
            Contact Phone
          </label>
          <div class="col-sm-8">
            <input
              type="text"
              formControlName="contactPhone"
              class="form-control"
              id="contactPhone"
              value=""
            />
          </div>
        </div>
      </div>
      <!-- Kolom Kanan: KK No -->
      <div class="col-12 col-lg-6">
        <div class="row align-items-center">
          <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="kkNo"> KK No </label>
          <div class="col-sm-8">
            <input type="text" formControlName="kkNo" class="form-control" id="kkNo" value="" />
          </div>
        </div>
      </div>
    </div>
    <!-- BARIS 2: Ktp no & sim no   -->
    <div class="row mb-3">
      <!-- Kolom Kiri: Ktp No -->
      <div class="col-12 col-lg-6">
        <div class="row align-items-center">
          <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="ktpNo"> Ktp No </label>
          <div class="col-sm-8">
            <input type="text" formControlName="ktpNo" class="form-control" id="ktpNo" value="" />
          </div>
        </div>
      </div>
      <!-- Kolom Kanan: Sim No -->
      <div class="col-12 col-lg-6">
        <div class="row align-items-center">
          <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="simNo"> Sim No </label>
          <div class="col-sm-8">
            <input type="text" formControlName="simNo" class="form-control" id="simNo" value="" />
          </div>
        </div>
      </div>
    </div>
    <!-- Search Button -->
    <div class="container-sm mt-2">
      <button class="btn btn-primary btn-sm px-4 rounded-1">Search</button>
    </div>
  </form>
</section>
<section class="project-panel my-3">
  <div class="row my-2">
    <span>Result</span>
  </div>
  <hr />
  <div class="table-responsive">
    <table class="table">
      <thead class="table-overview">
        <tr>
          <th scope="col">Driver Name</th>
          <th scope="col">Phone</th>
          <th scope="col">Address</th>
          <th scope="col">Gender</th>
          <th scope="col">City</th>
          <th scope="col">Religion</th>
          <th scope="col">KTP No</th>
          <th scope="col">SIM No</th>
          <th scope="col">SIM Type</th>
          <th scope="col">SIM Expiry</th>
          <th scope="col">Project Name</th>
          <th scope="col">Vehicle Type</th>
          <th scope="col">Bank Account</th>
          <th scope="col">Bank Name</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>* Click search to view data</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
