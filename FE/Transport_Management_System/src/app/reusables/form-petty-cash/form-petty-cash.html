<form class="container-fluid">
  <div class="row">
    <!-- Kolom Kiri (Input Fields) -->
    <div class="col-lg-7 col-md-9">
      <!-- Row 1: Type (Radio) -->
      <div class="row mb-3 align-items-center">
        <label class="col-sm-4 text-sm-end fw-bold col-form-label"
          >Type <span class="text-danger">*</span></label
        >
        <div class="col-sm-8">
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="radio"
              name="searchType"
              id="typeBank"
              value="bank"
              checked
            />
            <label class="form-check-label text-secondary" for="typeBank">Bank</label>
          </div>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="radio"
              name="searchType"
              id="typeCash"
              value="cash"
            />
            <label class="form-check-label text-secondary" for="typeCash">Cash</label>
          </div>
        </div>
      </div>

      <!-- Row 2: Account (Select) -->
      <div class="row mb-3 align-items-center">
        <label for="accountSelect" class="col-sm-4 text-sm-end fw-bold col-form-label"
          >Account <span class="text-danger">*</span></label
        >
        <div class="col-sm-8">
          <select class="form-select form-select-sm form-select-placeholder" id="accountSelect">
            <option selected disabled>Select an option</option>
            <option value="1">Account 1</option>
            <option value="2">Account 2</option>
          </select>
        </div>
      </div>

      <!-- Row 3: Transaction Date (Input Group) -->
      <div class="row mb-3 align-items-center">
        <label for="transactionDate" class="col-sm-4 text-sm-end fw-bold col-form-label"
          >Transaction Date <span class="text-danger">*</span></label
        >
        <div class="col-8">
          <div class="dp-hidden position-absolute">
            <div class="input-group">
              <input
                name="datepicker"
                class="form-control"
                ngbDatepicker
                #datepicker="ngbDatepicker"
                [autoClose]="'outside'"
                (dateSelect)="onDateSelection($event)"
                [displayMonths]="2"
                [dayTemplate]="t"
                outsideDays="hidden"
                [startDate]="fromDate!"
                tabindex="-1"
              />
              <ng-template #t let-date let-focused="focused">
                <span
                  class="custom-day"
                  [class.focused]="focused"
                  [class.range]="isRange(date)"
                  [class.faded]="isHovered(date) || isInside(date)"
                  (mouseenter)="hoveredDate = date"
                  (mouseleave)="hoveredDate = null"
                >
                  {{ date.day }}
                </span>
              </ng-template>
            </div>
          </div>
          <div class="input-group">
            <input
              (click)="datepicker.toggle()"
              #dpFromDate
              class="form-control"
              placeholder="dd-mm-yyyy"
              name="dpFromDate"
              [value]="fromDate | customDateFormatter: toDate"
              (input)="fromDate = validateInput(fromDate, dpFromDate.value)"
            />
            <button class="btn btn-outline-secondary" type="button" (click)="datepicker.toggle()">
              <i class="fa-regular fa-calendar-days"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Row 4: Type Secondary (Select) -->
      <div class="row mb-3 align-items-center">
        <label for="secondaryType" class="col-sm-4 text-sm-end fw-bold col-form-label">Type</label>
        <div class="col-sm-6">
          <select class="form-select form-select-sm form-select-placeholder" id="secondaryType">
            <option selected disabled>Select an option</option>
            <option value="1">Option A</option>
            <option value="2">Option B</option>
          </select>
        </div>
      </div>

      <!-- Row 5: Checkbox -->
      <div class="row mb-3">
        <div class="col-sm-8 offset-sm-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="showMoreResults" />
            <label
              class="form-check-label text-secondary"
              for="showMoreResults"
              style="font-size: 0.8rem"
            >
              Show more than 100 results
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Kolom Kanan (Tombol Kuning / Non Operational Cost) -->
    <div class="col-lg-5 col-md-3 text-start text-lg-end mb-3 mb-lg-0">
      <button
        type="button"
        class="btn btn-warning btn-sm rounded-1 px-3"
        (click)="openNonOps(contentNonOps)"
      >
        Non Operational Cost
      </button>
    </div>
  </div>

  <!-- modal template -->
  <ng-template #contentNonOps let-modal>
    <div class="modal-header">
      <h4 class="modal-title">Add Service</h4>
      <button
        type="button"
        class="btn-close"
        aria-label="Close"
        (click)="modal.dismiss('Cross click')"
      ></button>
    </div>
    <div class="modal-body">
      <form class="container-fluid">
        <div class="row mb-3">
          <!-- Kolom Kiri: Cashier Name  -->
          <div class="col-12 col-lg-6">
            <div class="row align-items-center">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="customerName">
                Cashier Name <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <input
                  type="text"
                  class="form-control"
                  id="customerName"
                  placeholder="Enter Cashier Name"
                  readonly
                />
              </div>
            </div>
          </div>
          <!-- Kolom Kanan: Date -->
          <div class="col-12 col-lg-6">
            <div class="row align-items-center">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="booking-date">
                Date <span class="text-danger">*</span>
              </label>
              <div class="col-sm-5">
                <input class="form-control" id="booking-date" type="date" value="" />
              </div>
            </div>
          </div>
        </div>
        <div class="row mb-3">
          <!-- Kolom Kiri: Transfer to -->
          <div class="col-12 col-lg-6">
            <div class="row align-items-center">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="customerName">
                Transfer to <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="searchType"
                    id="typeDriver"
                    value="bank"
                    checked
                  />
                  <label class="form-check-label text-secondary" for="typeDriver">Driver</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="searchType"
                    id="typeClerk"
                    value="cash"
                  />
                  <label class="form-check-label text-secondary" for="typeClerk">Clerk</label>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- BARIS 3: Shipper & Consignee -->
        <div class="row mb-3">
          <!-- Kolom Kiri: Driver name  -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="shipper">
                Driver Name <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <select class="form-select mb-2" id="shipper">
                  <option value=""></option>
                  <option value="">SHIPPER</option>
                </select>
              </div>
            </div>
          </div>
          <!-- Kolom Kanan: Asset code -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="consignee">
                Asset Code <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <select class="form-select mb-2" id="consignee">
                  <option value=""></option>
                  <option value="">Consignee</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- BARIS 3: Vehicle Type  & Route -->
        <div class="row mb-3">
          <!-- Kolom Kiri: Vehicle Type   -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="shipper">
                Vehicle Type <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <select class="form-select mb-2" id="shipper">
                  <option value=""></option>
                  <option value="">SHIPPER</option>
                </select>
              </div>
            </div>
          </div>
          <!-- Kolom Kanan: Route -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="consignee">
                Route
              </label>
              <div class="col-sm-8">
                <select class="form-select mb-2" id="consignee">
                  <option value=""></option>
                  <option value="">Consignee</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- BARIS 3: Vehicle Type  & Route -->
        <div class="row mb-3">
          <!-- Kolom Kiri: Vehicle Type   -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="shipper">
                Vehicle Type <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <select class="form-select mb-2" id="shipper">
                  <option value=""></option>
                  <option value="">SHIPPER</option>
                </select>
              </div>
            </div>
          </div>
          <!-- Kolom Kanan: Route -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="consignee">
                Route <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <select class="form-select mb-2" id="consignee">
                  <option value=""></option>
                  <option value="">Consignee</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- BARIS 3: Office name  & Project name -->
        <div class="row mb-3">
          <!-- Kolom Kiri: Office name   -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="shipper">
                Office Name <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <select class="form-select mb-2" id="shipper">
                  <option value=""></option>
                  <option value="">SHIPPER</option>
                </select>
              </div>
            </div>
          </div>
          <!-- Kolom Kanan: Project name -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="consignee">
                Project Name <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <select class="form-select mb-2" id="consignee">
                  <option value=""></option>
                  <option value="">Consignee</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- Row 5: Checkbox -->
        <div class="row mb-3">
          <div class="col-sm-4 offset-sm-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="showMoreResults" />
              <label
                class="form-check-label text-secondary"
                for="showMoreResults"
                style="font-size: 0.8rem"
              >
                Show more than 100 results
              </label>
            </div>
          </div>
        </div>
        <!-- BARIS 3: Change name  & Based on -->
        <div class="row mb-3">
          <!-- Kolom Kiri: Change name   -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="shipper">
                Change Name <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <select class="form-select mb-2" id="shipper">
                  <option value=""></option>
                  <option value="">SHIPPER</option>
                </select>
              </div>
            </div>
          </div>
          <!-- Kolom Kanan: Based on -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="consignee">
                Based on <span class="text-danger">*</span>
              </label>
              <div class="col-sm-8">
                <select class="form-select mb-2" id="consignee">
                  <option value=""></option>
                  <option value="">Consignee</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- BARIS 3: Quantity  & Rate -->
        <div class="row mb-3">
          <!-- Kolom Kiri: Quantity   -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="quantity">
                Quantity
              </label>
              <div class="col-sm-8">
                <input class="form-control" type="text" value="" />
              </div>
            </div>
          </div>
          <!-- Kolom Kanan: Rate -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="consignee">
                Rate
              </label>
              <div class="col-sm-8">
                <input class="form-control" type="text" value="" />
              </div>
            </div>
          </div>
        </div>
        <!-- BARIS 3: Amount -->
        <div class="row mb-3">
          <!-- Kolom Kiri: Amount   -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="quantity">
                Amount
              </label>
              <div class="col-sm-8">
                <input class="form-control" type="text" value="" />
              </div>
            </div>
          </div>
        </div>
        <!-- BARIS 3: Remark -->
        <div class="row mb-3">
          <!-- Kolom Kiri: Remark   -->
          <div class="col-12 col-lg-6">
            <div class="row">
              <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="quantity">
                Remark
              </label>
              <div class="col-sm-8">
                <textarea class="form-control" rows="3"></textarea>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="modal.close('Close click')">
        Close
      </button>
      <button type="button" class="btn btn-success" (click)="modal.close('Close click')">
        Save Changes
      </button>
    </div>
  </ng-template>

  <!-- Bagian Footer Form (Tombol Search) -->
  <div class="border-t pt-3 mt-3 text-start">
    <button type="submit" class="btn btn-primary btn-sm px-4 rounded-1">Search</button>
  </div>
</form>
