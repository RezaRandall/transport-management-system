<section class="project-panel project-form" aria-labelledby="project-form-title">
  <div class="project-panel__heading">
    <div>
      <p class="projects-page__eyebrow">Search Employee</p>
    </div>
  </div>

  <form class="container-fluid">
    <!-- BARIS 1: Employee Name & Email  -->
    <div class="row mb-3">
      <!-- Kolom Kiri: Employee Name -->
      <div class="col-12 col-lg-6">
        <div class="row align-items-center">
          <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="employeeName">
            Employee Name
          </label>
          <div class="col-sm-8">
            <input
              type="text"
              formControlName="employeeName"
              class="form-control"
              id="employeeName"
              value=""
            />
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-xl-6 d-flex justify-content-end">
        <input
          formControlName="newEmployee"
          class="btn btn-warning"
          id="new-booking"
          name="newBooking"
          type="button"
          value="New Employee"
          routerLink="/admin/employee"
        />
      </div>
    </div>
    <!-- BARIS 2: Email  -->
    <div class="row mb-3">
      <!-- Kolom Kiri: Contact Phone -->
      <div class="col-12 col-lg-6">
        <div class="row align-items-center">
          <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="email"> Email </label>
          <div class="col-sm-8">
            <input type="email" formControlName="email" class="form-control" id="email" value="" />
          </div>
        </div>
      </div>
    </div>
    <!-- BARIS 2: Role   -->
    <div class="row mb-3">
      <!-- Kolom Kiri: Role -->
      <div class="col-12 col-lg-6">
        <div class="row align-items-center">
          <label class="col-sm-4 col-form-label text-sm-end fw-bold" for="role"> Role </label>
          <div class="col-sm-8">
            <input type="text" formControlName="role" class="form-control" id="role" value="" />
          </div>
        </div>
      </div>
    </div>
    <!-- Search Button -->
    <div class="container-sm mt-2">
      <button class="btn btn-primary btn-sm px-4 rounded-1">Search</button>
    </div>
  </form>
</section>
<section class="project-panel my-3">
  <div class="row my-2">
    <span>Result</span>
  </div>
  <hr />
  <div class="table-responsive">
    <table class="table">
      <thead class="table-overview">
        <tr>
          <th scope="col">Full Name</th>
          <th scope="col">Email</th>
          <th scope="col">Gender</th>
          <th scope="col">Phone</th>
          <th scope="col">Role</th>
          <th scope="col">Username</th>
          <th scope="col">Bank No</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>* Click search to view data</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
